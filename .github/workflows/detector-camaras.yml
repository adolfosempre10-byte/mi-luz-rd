name: Detector de camaras (quitar descarga publica)

on:
  push:
    paths:
      - ".github/workflows/detector-camaras.yml"

permissions:
  contents: write

jobs:
  quitar-descarga:
    runs-on: ubuntu-latest
    steps:
      - name: Borrar el enlace publico de descarga del .exe
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete detector-camaras --yes --cleanup-tag || echo "Ya no existia"
